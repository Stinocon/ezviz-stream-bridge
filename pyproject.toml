[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ezviz-stream-bridge"
version = "0.1.0"
description = "Serve EZVIZ camera video as local MPEG-TS for go2rtc, Frigate and Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stinocon" }]
keywords = ["ezviz", "home-assistant", "frigate", "go2rtc", "mpegts", "rtsp"]

# pyezvizapi does the whole cloud and stream protocol; this package is the supervisor
# that keeps a session alive and one proxy running per camera. The lower bound is the
# first release carrying `stream proxy`, which is the command everything here builds on.
dependencies = ["pyezvizapi>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ezviz-stream-bridge = "ezviz_stream_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/Stinocon/ezviz-stream-bridge"
"Add-on repository" = "https://github.com/Stinocon/addons"

[tool.setuptools.packages.find]
include = ["ezviz_stream_bridge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test, and an HTTP status is clearer written as 401 than
# named at the top of the file and dereferenced at the assertion.
"tests/*" = ["S101", "PLR2004"]
# The probes are single-purpose diagnostic scripts, and the numbers in them are wire
# constants: EtherType 0x8d8d, the printable-ASCII range, the Ethernet header length.
# Naming each one moves it away from the parsing step that gives it meaning, which for
# protocol code costs more readability than it buys. They also bind a listening socket
# to receive broadcast replies, which is the point of a discovery probe.
"tools/*" = ["PLR2004", "PLR0912", "PLR0915", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
