<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41bdf5"/><stop offset="1" stop-color="#1a7fae"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3346"/><stop offset="1" stop-color="#1a7fae"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9b0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffd9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(16 30)">
