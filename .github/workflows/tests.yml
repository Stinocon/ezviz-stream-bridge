name: "Tests"

# The two gates `.pi/verify.json` names -- pytest and ruff -- had no runner but whichever machine
# remembered to run them. This runs both on every pull request and on every push to main, in the
# environment uv.lock pins: the same pyezvizapi the add-on image installs, so a test that passes
# here passes against the library the add-on actually ships.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: pytest and ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the failure report below, which is posted on the pull request so the reason a
      # check went red can be read without opening the Actions log.
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # FFmpeg with ffprobe and libx265: the program-stream test builds a real HEVC stream, strips
      # its parameter sets and checks the cached ones make it decodable again. Without FFmpeg that
      # test skips, and the one check that runs the real demuxer would stop running unnoticed.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 3.13 because that is what the add-on image runs: its base is Debian trixie.
          python-version: "3.13"

      # --frozen: install exactly what uv.lock pins, and do not let a resolver pick anything newer.
      - name: Install the locked environment
        run: uv sync --frozen --extra dev

      - name: Lint
        id: lint
        shell: bash
        run: .venv/bin/ruff check --output-format=concise . 2>&1 | tee lint.log

      # Runs even when the lint failed: the two answer different questions, and a red lint should
      # not hide whether the behaviour still holds.
      - name: Tests
        id: tests
        if: ${{ !cancelled() }}
        shell: bash
        run: .venv/bin/python -m pytest -q -rs 2>&1 | tee pytest.log

      - name: Report the failure on the pull request
        if: >-
          ${{ failure() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          {
            echo "### Tests failed on ${HEAD_SHA::7}"
            echo
            echo "Lint: ${{ steps.lint.outcome }} · Tests: ${{ steps.tests.outcome }}"
            for log in lint.log pytest.log; do
              [ -s "${log}" ] || continue
              echo
              echo "<details><summary>${log} (last 150 lines)</summary>"
              echo
              echo '```'
              tail -n 150 "${log}"
              echo '```'
              echo "</details>"
            done
          } > report.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file report.md
